<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <main class="site__main">
        <section class="user">
            <div class="cointeyner user__wraper">
                <ul class="user__list">
                    <li class="user__item">
                        <div class="user__top-content">
                            <span class="user_id">0</span>
                            <h3 class="user_title">Name</h3>
                        </div>
                        <h4 class="user__subtitle">body</h4>
                        <a href="mailto:link@gmail.com" class="user_email">link@gmail.com</a>
                    </li>
                </ul>
            </div>
        </section>
        <section class="post">
            <div class="cointeyner post__wraper">
                <ul class="post__list">
                    <li class="post__item">
                        <div class="post__top-content">
                            <span class="post_id">0</span>
                            <h3 class="post_title">Name</h3>
                        </div>
                        <p class="post_text">body</p>
                    </li>
                </ul>
            </div>
        </section>
        <section class="comment">
            <div class="cointeyner comment__wraper">
                <ul class="comment__list">
                    <li class="comment__item">
                        <div class="comment__top-content">
                            <span class="comment_id">0</span>
                            <h3 class="comment_title">Name</h3>
                        </div>
                        <a href="mailto: link@gmail.com" class="comment_email">link@gmail.com</a>
                        <p class="comment_text">body</p>
                    </li>
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
